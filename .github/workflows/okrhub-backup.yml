# OKR Hub fork (OKR-169): weekly encrypted database backup to Google Drive,
# with a restore test into a scratch database on every run.
#
# Secrets (repo Settings > Secrets and variables > Actions):
#   BACKUP_DATABASE_URL      Neon connection string, pooling OFF (direct)
#   BACKUP_PASSPHRASE        encryption passphrase (also kept in Mike's password manager)
#   GDRIVE_SA_JSON           Google service account key (JSON)
#   GDRIVE_SHARED_DRIVE_ID   ID of the Shared Drive the service account can write to
# Files land in "<Shared Drive>/NextCRM backups/", kept 12 weeks.
# On failure an issue is opened and assigned to mikehorw (GitHub emails him).

name: OKR Hub backup

on:
  schedule:
    - cron: "17 3 * * 0" # Sundays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: okrhub-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      scratch:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: scratch
          POSTGRES_DB: scratch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FOLDER: NextCRM backups
    steps:
      - name: Install PostgreSQL 17 client and rclone
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 rclone >/dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump production
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          echo "NAME=nextcrm-${STAMP}.dump" >> "$GITHUB_ENV"
          pg_dump --format=custom --no-owner --no-acl --dbname="$DATABASE_URL" --file="nextcrm-${STAMP}.dump"
          # Production counts, to compare after the restore.
          psql "$DATABASE_URL" -Atc 'select count(*) from "crm_Contacts"' > prod_contacts
          psql "$DATABASE_URL" -Atc 'select count(*) from "crm_Opportunities"' > prod_opps
          ls -l "nextcrm-${STAMP}.dump"

      - name: Restore test into a scratch database
        env:
          PGPASSWORD: scratch
        run: |
          set -euo pipefail
          SCRATCH="postgresql://postgres:scratch@localhost:5432/scratch"
          psql "$SCRATCH" -qc "create extension if not exists vector"
          pg_restore --no-owner --no-acl --dbname="$SCRATCH" "$NAME" 2> restore.log || { tail -20 restore.log; exit 1; }
          C=$(psql "$SCRATCH" -Atc 'select count(*) from "crm_Contacts"')
          O=$(psql "$SCRATCH" -Atc 'select count(*) from "crm_Opportunities"')
          echo "contacts: prod $(cat prod_contacts) restored $C"
          echo "opportunities: prod $(cat prod_opps) restored $O"
          test "$C" = "$(cat prod_contacts)" && test "$O" = "$(cat prod_opps)"

      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PASSPHRASE"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "$NAME.gpg" "$NAME"
          shred -u "$NAME"

      - name: Upload to Google Drive and prune
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GDRIVE_TEAM_DRIVE: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
        run: |
          set -euo pipefail
          rclone copy "$NAME.gpg" "gdrive:$FOLDER"
          rclone delete "gdrive:$FOLDER" --min-age 84d --include "nextcrm-*.dump.gpg"
          rclone lsl "gdrive:$FOLDER" | sort -k2 | tail -5

      - name: Open an issue if the backup failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CRM backup failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The weekly NextCRM backup failed. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              assignees: ["mikehorw"],
            });
